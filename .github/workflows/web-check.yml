# Builds the website on every pull request and every push that touches web/, so a broken UI
# change shows a red cross before it reaches main. It does not deploy anything (pages.yml does).
name: Website build check

on:
  pull_request:
    paths: ["web/**", ".github/workflows/web-check.yml"]
  push:
    branches-ignore: [main]
    paths: ["web/**", ".github/workflows/web-check.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Map tests (2D map and 3D globe helpers)
        working-directory: web
        run: npm test
