# SHIFT recent detections (D38), TEST RUN on the feature branch only.
# Fetches NOAA-20 and NOAA-21 FIRMS NRT detections from 28 Oct 2026 to today with the repository
# secret NASA_FIRMS_MAP_KEY, checks every row, writes the website files (status, overview, tiles)
# and puts them in the DRAFT release "recent-firms-preview" (drafts trigger no workflow, so the live
# site is not redeployed). It deploys nothing and changes no historical data. GitHub never gives secrets to pull requests
# from forks, and this workflow does not run on pull requests at all.
name: Recent detections (test fetch)

on:
  push:
    branches: [feature/recent-firms]
    paths: ["recent/**", ".github/workflows/recent-firms.yml"]
  workflow_dispatch:

permissions:
  contents: write   # only to update the draft release recent-firms-preview

concurrency:
  group: recent-firms-test
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: SHIFT non-fire cells (read only, from the release site-data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download site-data -p site_data.zip -D "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"
          unzip -q -j "$RUNNER_TEMP/site_data.zip" notfire.json -d "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/notfire.json"
      - name: Fetch and check (the key is never printed)
        env:
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
        run: python recent/fetch_firms.py --out "$RUNNER_TEMP/recent" --notfire "$RUNNER_TEMP/notfire.json"
      - name: Summary (no key in it)
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "recent" / "status.json"
          if not p.exists():
              print("no status.json written"); raise SystemExit(0)
          s = json.loads(p.read_text())
          print("window", s["window"], "| rows", s["rows"], "| web MB", round(s["web_bytes"] / 1e6, 2), "| complete", s["complete"])
          print("overview cells", s["overview_cells"], "| tiles", len(s["tiles"]), "| biggest tile", max(s["tiles"].values(), default=0),
                "| non-fire flagged", s["nonfire_flagged"], "| latest detection", s["latest_detection_utc"])
          for name, q in s["products"].items():
              print(name, "rows", q["rows"], "| requests ok", q["requests_ok"], "of", len(q["requests"]),
                    "| rejected", q["rejected"], "| duplicates", q["duplicates_removed"])
              print("  per day", q["per_day"])
              print("  days without data", q["days_without_data"])
              for r in q["requests"]:
                  print("  ", r)
          PY
      - name: Put the files in the draft release recent-firms-preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/recent" && zip -q -r "$RUNNER_TEMP/recent_preview.zip" . && cd -
          gh release view recent-firms-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create recent-firms-preview --draft --repo "$GITHUB_REPOSITORY" \
              --title "Recent detections preview (draft, not used by the live site)" \
              --notes "Test output of .github/workflows/recent-firms.yml on feature/recent-firms."
          gh release upload recent-firms-preview "$RUNNER_TEMP/recent_preview.zip" --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recent-firms-test
          path: ${{ runner.temp }}/recent/
          retention-days: 7
