# Builds the SHIFT website (web/) with the data from the release "site-data" (site_data.zip,
# written by pipeline stage `export`) and publishes it on GitHub Pages.
# Runs on every change to web/ or recent/, whenever a release is published or edited (a new
# site_data.zip), every 3 hours to refresh the recent detections (D38), and by hand
# (Actions > Website > Run workflow). To freeze the site during judging: Actions > Website >
# "..." > Disable workflow (and Enable it again afterwards).
name: Website

on:
  push:
    branches: [main]
    paths: ["web/**", "recent/**", ".github/workflows/pages.yml"]
  release:
    types: [published, edited]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"   # recent detections refresh (D38). GitHub may start it late

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fetch the site data (release site-data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download site-data -p site_data.zip -D "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"
          mkdir -p web/public/data
          unzip -q "$RUNNER_TEMP/site_data.zip" -d web/public/data
          test -f web/public/data/meta.json
          du -sh web/public/data
      - name: Recent detections (D38, raw FIRMS NRT). A failure never stops the deploy
        continue-on-error: true
        env:
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
        run: python3 recent/fetch_firms.py --out web/public/data/recent --notfire web/public/data/notfire.json
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
